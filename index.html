<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="css/style.css">
  <title>Frontend Mentor | Results summary component</title>

 
</head>
<body>


  <main>

    <section class="result-card">
      <h3>Your Result</h3>
      <div class="circle-shape">
        <p class="result-no">76</p>
        <p class="from-hundred">of 100</p>
      </div>
      <strong>Great</strong>
      <p class="description">You scored higher than 65% of the people who have taken these tests.</p>
    </section>

    <section class="summary-card">
        <h3>Summary</h3>
        <div class="cards">
        <div class="reaction card">
          <div class="txt">
            <img src="assets/images/icon-reaction.svg" alt="">
            <p>Reaction</p>
          </div>
          <p class="data"><span class="bold">80</span> / 100</p>
        </div>
        <div class="memory card">
          <div class="txt">
            <img src="assets/images/icon-memory.svg" alt="">
            <p>Memory</p>
          </div>  
          <p class="data"><span class="bold">92</span> / 100</p>
        </div>
        <div class="verbal card">
          <div class="txt">
            <img src="assets/images/icon-verbal.svg" alt="">
            <p>Verbal</p>
          </div>
          <p class="data"><span class="bold">61</span> / 100</p>
        </div>
        <div class="visual card">
          <div class="txt">
            <img src="assets/images/icon-visual.svg" alt="">
            <p>Visual</p>
          </div>      
          <p class="data"><span class="bold">72</span> / 100</p>
        </div>
        </div>
        <a href="#">Continue</a>
    </section>

  </main>

</body>
</html>
